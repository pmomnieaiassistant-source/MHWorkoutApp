<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MH Lift">
<meta name="theme-color" content="#0A0B0D">
<title>MH Lift</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root {
  --bg: #0A0B0D; --card: #14171C; --card2: #1B1F26; --card3: #232831; --line: #252B34; --text: #F2F4F7; --mute: #8A93A0; --dim: #5D6571;
  --lime: #C6F432; --lime-ink: #11140A; --blue: #5AB0FF; --orange: #FF8A3D; --red: #FF5A5F; --green: #3DDC84; --yellow: #FFC940;
  --r: 18px; --r-sm: 12px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; overscroll-behavior-y: none; touch-action: manipulation; }   /* no double-tap zoom; pinch still works */
body.noscroll { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; width: 100%; outline: none; }
input:focus, textarea:focus, select:focus { border-color: #3A4350; }
textarea { resize: vertical; min-height: 120px; }
select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--mute) 50%), linear-gradient(135deg, var(--mute) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
a { color: var(--lime); text-decoration: none; cursor: pointer; }
svg { display: block; }
.muted { color: var(--mute); } .dim { color: var(--dim); } .small { font-size: 13px; } .tiny { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.row { display: flex; align-items: center; gap: 10px; } .grow { flex: 1; min-width: 0; } .wrap { flex-wrap: wrap; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* header */
.top { position: sticky; top: 0; z-index: 20; padding: calc(var(--safe-t) + 14px) 18px 10px; background: rgba(10, 11, 13, .82); backdrop-filter: saturate(160%) blur(18px); -webkit-backdrop-filter: saturate(160%) blur(18px); }
.top h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.top .sub { color: var(--mute); font-size: 14px; margin-top: 2px; }
.ibtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--card); color: var(--text); flex: none; position: relative; }
.ibtn:active { transform: scale(.94); }
.ibtn i { position: absolute; top: 2px; right: 2px; width: 9px; height: 9px; border-radius: 50%; background: var(--lime); }
#view { padding: 4px 16px calc(var(--safe-b) + 110px); }

/* bottom nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around; padding: 8px 10px calc(var(--safe-b) + 8px); background: rgba(14, 16, 19, .9); backdrop-filter: saturate(160%) blur(20px); -webkit-backdrop-filter: saturate(160%) blur(20px); border-top: 1px solid rgba(255, 255, 255, .05); }
nav.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--dim); padding: 4px 0; }
nav.tabs button.on { color: var(--lime); }

/* cards and chips */
.card { background: var(--card); border-radius: var(--r); padding: 16px; margin: 12px 0; position: relative; }
.card.tap:active { transform: scale(.985); }
.card h3 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.sec { margin: 22px 2px 8px; font-size: 13px; font-weight: 700; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; justify-content: space-between; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px; background: var(--card2); color: var(--text); font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip.lime { background: rgba(198, 244, 50, .14); color: var(--lime); } .chip.blue { background: rgba(90, 176, 255, .14); color: var(--blue); } .chip.orange { background: rgba(255, 138, 61, .14); color: var(--orange); }
.chip.on { background: var(--lime); color: var(--lime-ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; } .chips::-webkit-scrollbar { display: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 14px; font-weight: 700; background: var(--lime); color: var(--lime-ink); }
.btn:active { transform: scale(.97); } .btn.gray { background: var(--card2); color: var(--text); } .btn.ghost { background: transparent; color: var(--mute); } .btn.danger { background: rgba(255, 90, 95, .14); color: var(--red); }
.btn.block { width: 100%; } .btn:disabled { opacity: .45; } .btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
.btns { display: flex; gap: 10px; margin-top: 16px; } .btns > * { flex: 1; } .btns.col { flex-direction: column; }
.seg { display: flex; background: var(--card); border-radius: 13px; padding: 4px; gap: 4px; }
.seg button { flex: 1; padding: 9px 0; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--mute); }
.seg button.on { background: var(--card3); color: var(--text); }
.empty { text-align: center; color: var(--mute); padding: 36px 16px; }
.empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
.stars { display: inline-flex; gap: 2px; color: var(--dim); } .stars .on { color: var(--lime); }
.lbl { font-size: 13px; color: var(--mute); margin: 14px 2px 6px; font-weight: 600; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-top: 12px; }
.kv > div { background: var(--card2); border-radius: 12px; padding: 10px 12px; }
.kv b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.kv span { font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.warn { color: var(--orange); }
.fab { position: fixed; right: 18px; bottom: calc(var(--safe-b) + 84px); z-index: 25; width: 58px; height: 58px; border-radius: 50%; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; box-shadow: 0 10px 30px rgba(198, 244, 50, .25); }
.fab:active { transform: scale(.94); }
.toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 96px); transform: translateX(-50%) translateY(20px); background: var(--card3); padding: 12px 18px; border-radius: 14px; z-index: 200; opacity: 0; transition: .25s; max-width: 88vw; font-size: 14px; font-weight: 600; pointer-events: none; }
.toast.in { opacity: 1; transform: translateX(-50%); }

/* overlays */
.shade { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, 0); transition: background .22s; display: flex; align-items: flex-end; }
.shade.in { background: rgba(0, 0, 0, .55); }
.sheet { width: 100%; max-height: 88vh; overflow-y: auto; background: #111418; border-radius: 22px 22px 0 0; padding: 10px 18px calc(var(--safe-b) + 22px); transform: translateY(100%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); }
.shade.in .sheet { transform: none; }
.sheet:before { content: ""; display: block; width: 38px; height: 5px; border-radius: 3px; background: var(--card3); margin: 0 auto 14px; }
.sheet h2 { margin: 0 0 6px; font-size: 21px; letter-spacing: -.01em; }
.full { position: fixed; inset: 0; z-index: 90; background: var(--bg); overflow-y: auto; opacity: 0; transform: translateY(8%) scale(.94); border-radius: 26px; transition: transform .34s cubic-bezier(.2, .9, .25, 1), opacity .22s, border-radius .34s; }
.full.in { transform: none; opacity: 1; border-radius: 0; }
.hero { border-radius: 24px; padding: 20px 18px; margin-top: 4px; position: relative; overflow: hidden; }
.hero.blue { background: linear-gradient(140deg, rgba(90, 176, 255, .30), rgba(90, 176, 255, .06) 70%), var(--card); }
.hero.lime { background: linear-gradient(140deg, rgba(198, 244, 50, .24), rgba(198, 244, 50, .04) 70%), var(--card); }
.hero.orange { background: linear-gradient(140deg, rgba(255, 138, 61, .26), rgba(255, 138, 61, .05) 70%), var(--card); }
.hero h1 { margin: 6px 0 2px; font-size: 30px; letter-spacing: -.02em; line-height: 1.1; }
.hero.blue .fmt { color: var(--blue); } .hero.orange .fmt { color: var(--orange); }
.ring { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.ring > div { width: 74px; height: 74px; border-radius: 50%; background: #13171c; display: grid; place-items: center; font-weight: 900; font-size: 22px; }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin-top: 12px; gap: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--mute); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
.fbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: calc(var(--safe-t) + 10px) 14px 10px; background: rgba(10, 11, 13, .88); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
.fbar .t { flex: 1; text-align: center; font-weight: 700; font-size: 16px; }
.fbody { padding: 6px 16px calc(var(--safe-b) + 110px); }
.fbottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(var(--safe-b) + 14px); background: linear-gradient(transparent, var(--bg) 30%); z-index: 6; }
.menu-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 15px 4px; border-bottom: 1px solid var(--line); font-weight: 600; text-align: left; }
.menu-item:last-child { border-bottom: 0; } .menu-item.danger { color: var(--red); }
.menu-item .grow { font-weight: 600; }

/* program */
.weekbar { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: var(--r); padding: 8px; margin-top: 4px; user-select: none; }
.weekbar .wk { text-align: center; } .weekbar .wk b { display: block; font-size: 16px; } .weekbar .wk span { font-size: 13px; color: var(--mute); }
.linkline { font-size: 13px; color: var(--mute); padding: 10px 4px 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.linkline b { color: var(--text); }
.day { margin-top: 14px; }
.dh { display: flex; align-items: center; gap: 8px; padding: 0 2px 8px; }
.dh b { font-size: 15px; } .dh .d { color: var(--mute); font-size: 14px; } .dh .chip { margin-left: auto; }
.day.today .dh b { color: var(--lime); }
.pitem { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px; padding: 13px 14px; margin-bottom: 8px; }
.pitem .bar { width: 4px; align-self: stretch; border-radius: 3px; background: var(--lime); }
.pitem.rest .bar { background: var(--dim); } .pitem.done .bar { background: var(--green); } .pitem.skipped .bar { background: var(--orange); }
.pitem .n { font-weight: 700; } .pitem .m { font-size: 13px; color: var(--mute); }
.blockdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 12px; }
.blockdays div { text-align: center; font-size: 11px; color: var(--mute); background: var(--card2); border-radius: 9px; padding: 6px 0; font-weight: 600; }
.blockdays div.has { background: rgba(198, 244, 50, .14); color: var(--lime); }
.code { font-family: var(--mono); font-size: 14px; line-height: 1.5; min-height: 52vh; white-space: pre; tab-size: 2; }
.tool { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; } .tool::-webkit-scrollbar { display: none; }
.wlist { margin-top: 8px; } .wlist div { font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line); }
.pcard { background: var(--card2); border-radius: 14px; padding: 12px 14px; margin-top: 8px; }
.pcard .ttl { font-weight: 700; } .pcard .ln { font-size: 14px; color: var(--mute); margin-top: 2px; }
.fmt { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--lime); }
.phase { margin: 22px 2px 6px; font-size: 13px; font-weight: 800; color: var(--mute); text-transform: uppercase; letter-spacing: .08em; }

/* workout cards (swipe) */
.wcard { position: relative; margin-bottom: 10px; border-radius: 16px; overflow: hidden; background: var(--orange); }
.wcard .act { position: absolute; inset: 0 0 0 auto; width: 96px; display: grid; place-items: center; font-weight: 800; color: #1A0E05; }
.wcard .front { position: relative; display: flex; align-items: stretch; background: var(--card); border-radius: 16px; transition: transform .22s; touch-action: pan-y; }
.wcard.dragging .front { transition: none; }
.wchk { width: 58px; display: grid; place-items: center; flex: none; }
.wchk span { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--dim); display: grid; place-items: center; color: transparent; }
.wcard.done .wchk span { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
.wcard.skipped .wchk span { border-color: var(--orange); color: var(--orange); }
.wbody { flex: 1; min-width: 0; padding: 14px 6px 14px 0; display: flex; align-items: center; gap: 8px; }
.wbody .t { font-weight: 700; } .wbody .s { font-size: 13px; color: var(--mute); margin-top: 2px; }
.wcard.done .wbody .t { color: var(--mute); } .wcard.skipped .wbody .t { color: var(--mute); text-decoration: line-through; }
.progress { height: 4px; background: var(--card2); border-radius: 2px; overflow: hidden; margin-top: 10px; }
.progress div { height: 100%; background: var(--lime); border-radius: 2px; transition: width .3s; }

/* execution: sets */
.setrow { display: grid; grid-template-columns: 54px 1fr 1fr 48px; gap: 8px; align-items: center; padding: 8px 0; }
.setrow .k { font-size: 12px; color: var(--mute); font-weight: 700; }
.setrow input { text-align: center; padding: 11px 6px; font-weight: 700; font-size: 17px; }
.setrow .unit { font-size: 11px; color: var(--mute); text-align: center; margin-top: 2px; }
.setchk { width: 44px; height: 44px; border-radius: 12px; background: var(--card2); display: grid; place-items: center; color: var(--dim); }
.setrow.done .setchk { background: var(--lime); color: var(--lime-ink); }
.setrow.done input { color: var(--mute); }
.hint { font-size: 13px; color: var(--mute); background: var(--card); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
#rest { position: fixed; left: 12px; right: 12px; bottom: calc(var(--safe-b) + 12px); z-index: 150; background: var(--blue); color: #04121F; border-radius: 20px; padding: 14px 16px; display: none; align-items: center; gap: 12px; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); }
#rest.on { display: flex; }
body.resting .fbottom { bottom: 92px; } body.resting .fbody { padding-bottom: calc(var(--safe-b) + 200px); }
#rest .big { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; flex: 1; }
#rest button { background: rgba(4, 18, 31, .14); border-radius: 12px; padding: 10px 12px; font-weight: 800; font-size: 14px; }

/* execution: timer */
.timer { position: fixed; inset: 0; z-index: 120; display: flex; flex-direction: column; padding: calc(var(--safe-t) + 10px) 20px calc(var(--safe-b) + 18px); background: #101215; transition: background .35s; color: var(--text); }
.timer.work { background: var(--lime); color: var(--lime-ink); } .timer.rest { background: var(--blue); color: #04121F; } .timer.prep { background: #1B1F26; }
.timer.flash:after { content: ""; position: absolute; inset: 0; background: #fff; animation: fl .5s ease-out forwards; pointer-events: none; }
@keyframes fl { from { opacity: .85; } to { opacity: 0; } }
.timer .tb { display: flex; align-items: center; justify-content: space-between; }
.timer .tb button { width: 42px; height: 42px; border-radius: 50%; background: rgba(0, 0, 0, .12); display: grid; place-items: center; }
.timer .lab { font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
.timer .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; gap: 6px; }
.timer .ex { font-size: clamp(30px, 9vw, 52px); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; }
.timer .det { font-size: 19px; font-weight: 700; opacity: .8; }
.timer .clock { font-size: clamp(80px, 30vw, 150px); font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.05em; line-height: 1; margin: 14px 0 4px; }
.timer .next { font-size: 15px; font-weight: 700; opacity: .65; }
.timer .ctl { display: flex; gap: 10px; } .timer .ctl button { flex: 1; min-height: 58px; border-radius: 16px; font-weight: 800; font-size: 17px; background: rgba(0, 0, 0, .14); }
.timer .ctl button.main { background: rgba(0, 0, 0, .82); color: #fff; }
.timer.prep .ctl button, .timer.idle .ctl button { background: var(--card3); } .timer.prep .ctl button.main, .timer.idle .ctl button.main { background: var(--lime); color: var(--lime-ink); }
.timer .steps { font-size: 17px; font-weight: 700; opacity: .85; line-height: 1.6; }
.counter { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 8px; font-weight: 800; }
.counter b { font-size: 40px; min-width: 70px; } .counter button { width: 54px; height: 54px; border-radius: 50%; background: rgba(0, 0, 0, .14); font-size: 26px; font-weight: 800; }
.timer.done { background: #101215; color: var(--text); }

/* feed: each kind of card has its own colour */
.card.k-day, .card.k-wo, .card.k-miss { overflow: hidden; }
.card.k-day:before, .card.k-wo:before, .card.k-miss:before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.card.k-day { background: linear-gradient(135deg, rgba(90, 176, 255, .13), rgba(90, 176, 255, .03) 60%), var(--card); }
.card.k-today { background: radial-gradient(120% 140% at 100% 0%, rgba(198, 244, 50, .22), rgba(198, 244, 50, 0) 55%), linear-gradient(160deg, #1B2027, #12151A); border: 1px solid rgba(198, 244, 50, .18); margin-top: 6px; }
.card.k-today .kv > div { background: rgba(255, 255, 255, .05); }
.card.k-day:before { background: var(--blue); } .card.k-day .fmt { color: var(--blue); }
.card.k-wo { background: linear-gradient(135deg, rgba(198, 244, 50, .10), rgba(198, 244, 50, .02) 60%), var(--card); }
.card.k-wo:before { background: var(--lime); }
.card.k-miss { background: linear-gradient(135deg, rgba(255, 138, 61, .10), rgba(255, 138, 61, .02) 60%), var(--card); }
.card.k-miss:before { background: var(--orange); } .card.k-miss .fmt { color: var(--orange); }
.daycard .date { font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
.rec { display: inline-grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; font-weight: 900; font-size: 17px; flex: none; }
.wo .corner { position: absolute; top: 12px; right: 12px; }
.wo .photo { width: 100%; height: 160px; object-fit: cover; border-radius: 12px; margin-top: 12px; }
.statline { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; }
.statline span b { font-weight: 800; }
.export { font-family: var(--mono); font-size: 13px; white-space: pre-wrap; background: var(--card); border-radius: 14px; padding: 14px; line-height: 1.55; }
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="view"></main>
<button class="fab" id="fab" data-a="manualStart" aria-label="Enter a workout" style="display:none"></button>
<nav class="tabs" id="tabs"></nav>
<div id="rest"></div>
<div class="toast" id="toast"></div>
<script src="version.js"></script>
<script src="config.js"></script>
<script src="parser.js"></script>
<script src="app.js"></script>
<script src="program.js"></script>
<script src="workout.js"></script>
</body>
</html>
